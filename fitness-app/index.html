<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <meta
      name="description"
      content="Pulse — a premium fitness & workout app to track workouts, calories, steps, water, goals and body progress."
    />
    <title>Pulse — Fitness & Workout Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script>
      // apply the stored theme before first paint to avoid a flash
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('pulse:v1:state') || 'null')
          var mode = 'dark'
          if (stored && stored.users && stored.currentUserId) {
            var user = stored.users.find(function (u) {
              return u.id === stored.currentUserId
            })
            if (user && user.settings && user.settings.theme) mode = user.settings.theme
          }
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = mode === 'dark' || (mode === 'system' && prefersDark)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
